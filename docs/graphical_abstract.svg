<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="980" height="340" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">SGK1 as a computational target for PND: from cross-species hub to pocket-stable TCM ligands</text>

  <!-- Stage 1 -->
  <rect x="20" y="90" width="160" height="130" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <text x="100" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Cross-species</text>
  <text x="100" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">pipeline</text>
  <text x="100" y="178" text-anchor="middle" font-size="12" fill="#1a1a1a">5 hub genes</text>
  <text x="100" y="198" text-anchor="middle" font-size="11" fill="#555">mouse + human</text>

  <!-- arrow 1 -->
  <path d="M182 155 L208 155" stroke="#455A64" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- Stage 2 -->
  <rect x="212" y="90" width="160" height="130" rx="8" fill="#E8F5E9" stroke="#388E3C" stroke-width="1.5"/>
  <text x="292" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">SGK1 / 7PUE</text>
  <text x="292" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">only dockable</text>
  <text x="292" y="178" text-anchor="middle" font-size="12" fill="#1a1a1a">kinase domain</text>
  <text x="292" y="198" text-anchor="middle" font-size="11" fill="#555">residues 82–376</text>

  <!-- arrow 2 -->
  <path d="M374 155 L400 155" stroke="#455A64" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- Stage 3 -->
  <rect x="404" y="90" width="170" height="130" rx="8" fill="#FFF3E0" stroke="#F57C00" stroke-width="1.5"/>
  <text x="489" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">TCM screen (Vina)</text>
  <text x="489" y="148" text-anchor="middle" font-size="12" fill="#1a1a1a">31 monomers</text>
  <text x="489" y="168" text-anchor="middle" font-size="12" fill="#1a1a1a">→ 6 + GSK650394</text>
  <text x="489" y="194" text-anchor="middle" font-size="11" fill="#555">BOILED-egg / Lipinski</text>

  <!-- arrow 3 -->
  <path d="M576 155 L602 155" stroke="#455A64" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- Stage 4 -->
  <rect x="606" y="90" width="160" height="130" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="686" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">100 ns MD</text>
  <text x="686" y="148" text-anchor="middle" font-size="12" fill="#1a1a1a">GROMACS 2026.3</text>
  <text x="686" y="168" text-anchor="middle" font-size="12" fill="#1a1a1a">amber99sb-ildn</text>
  <text x="686" y="194" text-anchor="middle" font-size="11" fill="#555">7 complexes × 100 ns</text>

  <!-- arrow 4 -->
  <path d="M768 155 L794 155" stroke="#455A64" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- Stage 5 -->
  <rect x="798" y="90" width="162" height="130" rx="8" fill="#E0F2F1" stroke="#00796B" stroke-width="1.5"/>
  <text x="879" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Pose retention</text>
  <text x="879" y="146" text-anchor="middle" font-size="11" fill="#1a1a1a">pocket 0.14–0.31 nm</text>
  <text x="879" y="166" text-anchor="middle" font-size="11" fill="#1a1a1a">all 7 ligands stay</text>
  <text x="879" y="192" text-anchor="middle" font-size="11" fill="#1a1a1a">ΔG −21 to −38 kcal/mol</text>

  <text x="490" y="258" text-anchor="middle" font-size="12" fill="#1a1a1a">Rebuilt four-chain receptor → global Rg / backbone-RMSD are discarded as stability metrics;</text>
  <text x="490" y="278" text-anchor="middle" font-size="12" fill="#1a1a1a">stability is judged solely from ligand–protein minimal distance (pocket retention).</text>

  <text x="490" y="312" text-anchor="middle" font-size="11" fill="#777">Purely computational. Rebuilt receptor and single-trajectory MM-PBSA limits stated as limitations.</text>

  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 3 L0 6 Z" fill="#455A64"/>
    </marker>
  </defs>
</svg>
